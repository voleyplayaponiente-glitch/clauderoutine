<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Norte">
  <defs>
    <linearGradient id="fondoOscuro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161C26"/>
      <stop offset="1" stop-color="#0B0E13"/>
    </linearGradient>
    <linearGradient id="norteAguja" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#6FD6FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#fondoOscuro)"/>

  <!-- Rosa de los vientos, apenas insinuada: orienta sin competir con la aguja. -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3" stroke-linecap="round">
    <circle cx="256" cy="256" r="176"/>
    <path d="M256 60 v22 M256 430 v22 M60 256 h22 M430 256 h22"/>
  </g>

  <!-- Sur: gris. El adorno nunca lleva color. -->
  <path d="M196 300 L316 300 L256 424 Z" fill="#39414F"
        stroke="#39414F" stroke-width="10" stroke-linejoin="round"/>

  <!-- Norte: el único color de la marca. Leída sola es una línea que sube. -->
  <path d="M256 88 L316 300 L196 300 Z" fill="url(#norteAguja)"
        stroke="url(#norteAguja)" stroke-width="10" stroke-linejoin="round"/>
</svg>
