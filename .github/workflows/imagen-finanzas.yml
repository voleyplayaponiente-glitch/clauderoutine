# Publica las imágenes de la app de finanzas para instalarla en el Umbrel,
# igual que se hace con la de gestión laboral.
#
# Son DOS imágenes porque son dos piezas distintas:
#   · gestor-finanzas      → nginx con la aplicación compilada
#   · gestor-finanzas-api  → el servicio de copias de seguridad (Node)
# En el Umbrel corren juntas y nginx pasa /api al servicio, de modo que la app y
# su servidor comparten dirección.
name: Imagen de finanzas para Umbrel

on:
  push:
    branches:
      - claude/tournament-bracket-manager-gvrcdt
    paths:
      - 'finanzas/**'
      - '.github/workflows/imagen-finanzas.yml'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Entrar en el registro de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Los tests del motor antes de publicar: una imagen que no pasa las
      # pruebas no debería llegar nunca al servidor.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: finanzas/package-lock.json
      - run: npm ci
        working-directory: finanzas
      - run: npm test
        working-directory: finanzas

      - name: Aplicación (nginx)
        uses: docker/build-push-action@v6
        with:
          context: finanzas
          file: finanzas/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/gestor-finanzas:latest
            ghcr.io/${{ github.repository_owner }}/gestor-finanzas:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Servicio de copias (Node)
        uses: docker/build-push-action@v6
        with:
          context: finanzas/servidor
          file: finanzas/servidor/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/gestor-finanzas-api:latest
            ghcr.io/${{ github.repository_owner }}/gestor-finanzas-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
