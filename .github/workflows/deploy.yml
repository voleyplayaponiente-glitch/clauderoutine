name: Desplegar en GitHub Pages

on:
  push:
    branches:
      - main
      - claude/tournament-bracket-manager-gvrcdt
  workflow_dispatch:

# Permisos necesarios para publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un único despliegue a la vez
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar (base de GitHub Pages)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      # ── App de gestión financiera (subruta /finanzas/), sin afectar al vóley ──
      - name: Instalar dependencias (finanzas)
        run: npm ci
        working-directory: finanzas

      - name: Ejecutar pruebas (finanzas)
        run: npm test
        working-directory: finanzas

      - name: Compilar finanzas (base /clauderoutine/finanzas/)
        run: npm run build
        working-directory: finanzas
        env:
          GITHUB_PAGES: 'true'

      - name: Combinar finanzas en el artefacto de Pages
        run: |
          mkdir -p dist/finanzas
          cp -r finanzas/dist/. dist/finanzas/

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          # Activa GitHub Pages automáticamente si aún no lo está
          enablement: true

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
