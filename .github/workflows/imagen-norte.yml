# Publica las imágenes de Norte para instalarla en el Umbrel.
#
# Son dos imágenes porque son dos piezas distintas:
#   · norte-web  → nginx con la interfaz compilada
#   · norte-api  → el servidor (Fastify + Prisma)
# La base de datos es la imagen oficial de PostgreSQL: no hay nada que publicar.
#
# La de la API solo se reconstruye si cambia `norte/api` o `norte/dominio`.
# Publicar dos imágenes en cada despliegue fue lo que disparó el límite
# secundario de GitHub en la app de empresa y dejó el Umbrel sirviendo una
# versión vieja mientras parecía que todo había ido bien.
name: Imagen de Norte para Umbrel

on:
  push:
    branches:
      - claude/app-control-presupuestario-f7omzh
    paths:
      - 'norte/**'
      - '.github/workflows/imagen-norte.yml'
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: norte
          POSTGRES_PASSWORD: norte
          POSTGRES_DB: norte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U norte -d norte_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: norte/package-lock.json

      - run: npm ci
        working-directory: norte

      # El motor primero: si falla una fórmula de dinero, no hay que esperar a
      # levantar media base de datos para enterarse.
      - run: npm run test -w @norte/dominio
        working-directory: norte

      # Los tests de aislamiento necesitan PostgreSQL de verdad. Son los que
      # sostienen la promesa de «tu pareja ve lo compartido y nada más», así que
      # ninguna imagen se publica sin que pasen.
      - run: npm run test -w @norte/api
        working-directory: norte
        env:
          DATABASE_URL_TEST: postgresql://norte:norte@localhost:5432/norte_test
          NORTE_SECRETO_SESION: secreto-de-integracion-continua-0123456789abcdef

      - run: npm run build
        working-directory: norte

  publicar:
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: docker/setup-buildx-action@v3

      - name: Entrar en el registro de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dos condiciones para reconstruir la imagen del servidor, y la segunda
      # existe porque la primera sola ya falló: un commit que tocaba solo el
      # `Dockerfile.api` no contaba como cambio, así que se saltó la
      # construcción y la imagen **no llegó a publicarse nunca**. El compose del
      # Umbrel apuntaba a algo que no existía.
      - name: ¿Hay que construir el servidor?
        id: cambios
        run: |
          construir=false

          # 1) Ha cambiado algo de lo que va dentro de la imagen.
          if ! git diff --quiet HEAD~1 HEAD -- \
              norte/api norte/dominio norte/package-lock.json norte/Dockerfile.api; then
            construir=true
            echo "Cambió el servidor."
          fi

          # 2) O la imagen no está publicada. Esto es lo que hace que el fallo
          #    se cure solo en el siguiente push en vez de quedarse escondido.
          token=$(curl -sf "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/norte-api:pull&service=ghcr.io" | jq -r '.token // empty')
          codigo=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/norte-api/manifests/latest")
          if [ "$codigo" != "200" ]; then
            construir=true
            echo "La imagen del servidor no se puede descargar (HTTP $codigo): se construye."
          fi

          echo "api=$construir" >> "$GITHUB_OUTPUT"

      - name: Aplicación (nginx)
        uses: docker/build-push-action@v6
        with:
          context: norte
          file: norte/Dockerfile.web
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/norte-web:latest
            ghcr.io/${{ github.repository_owner }}/norte-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Servidor (Fastify + Prisma)
        if: steps.cambios.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: norte
          file: norte/Dockerfile.api
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/norte-api:latest
            ghcr.io/${{ github.repository_owner }}/norte-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
