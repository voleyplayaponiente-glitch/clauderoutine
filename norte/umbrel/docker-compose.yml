# Norte en el Umbrel.
#
# Tres contenedores y **una sola puerta**:
#
#     navegador ──► norte_web (nginx, puerto 3012)
#                       │
#                       ├── /      → la aplicación compilada
#                       └── /api/… → norte_api (Fastify)
#                                        │
#                                        └── norte_db (PostgreSQL)
#
# Ni la API ni la base de datos publican puerto: solo se llega a ellas desde
# dentro. Dos cosas menos expuestas en la red de casa.
#
# Antes de levantarlo, copia `.env.example` a `.env` y rellena los secretos.

# **El nombre del proyecto se fija aquí y no es un detalle cosmético.** Sin esta
# línea, Compose lo deduce del nombre de la carpeta —`umbrel`— y colisiona con
# el proyecto del propio umbrelOS: pasa a ver `auth` y `tor_proxy` como
# contenedores huérfanos *suyos*, y un `docker compose down --remove-orphans`
# lanzado aquí se llevaría por delante piezas del sistema del usuario. Pasó en
# la primera instalación real, el 17/08/2026.
name: norte

services:
  web:
    image: ghcr.io/voleyplayaponiente-glitch/norte-web:latest
    container_name: norte_web
    restart: unless-stopped
    ports:
      # 3000 lo tiene gestor-laboral y 3011 gestión financiera. Comprueba con
      # `ss -lntp` antes de cambiarlo.
      - "${PUERTO_HOST:-3012}:80"
    depends_on:
      - api

  api:
    image: ghcr.io/voleyplayaponiente-glitch/norte-api:latest
    container_name: norte_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Por piezas y no como URL: si la contraseña trae una `@` o una `/`, una
      # cadena de conexión se parte por el sitio equivocado. El servidor la
      # escapa al construir la URL.
      NORTE_BD_HOST: db
      NORTE_BD_USUARIO: norte
      NORTE_BD_CONTRASENA: ${POSTGRES_PASSWORD}
      NORTE_BD_NOMBRE: norte
      NORTE_PUERTO: 3012
      NODE_ENV: production
      NORTE_DATOS_DIR: /datos
    volumes:
      # Los documentos subidos viven FUERA del contenedor: actualizar la app no
      # los toca.
      - ${APP_DATA_DIR:-.}/documentos:/datos
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: norte_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: norte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: norte
    volumes:
      # Aquí viven los datos de verdad. Este directorio es el que hay que
      # respaldar, y el que sobrevive a cualquier actualización de la app.
      - ${APP_DATA_DIR:-.}/postgres:/var/lib/postgresql/data
    healthcheck:
      # Sin esto, la API arranca antes que la base de datos, la migración falla
      # y el contenedor entra en bucle de reinicio.
      test: ["CMD-SHELL", "pg_isready -U norte -d norte"]
      interval: 5s
      timeout: 5s
      retries: 20
