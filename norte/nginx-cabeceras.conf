# Cabeceras de seguridad de Norte.
#
# Van en un `include` y NO sueltas en el bloque `server` por una trampa
# conocida de nginx: `add_header` **no se hereda** en cualquier location que
# tenga un `add_header` propio. Con las cabeceras escritas arriba, las rutas
# que añaden su `Cache-Control` (el index, los assets, el service worker…) se
# quedarían SIN las de seguridad — y serían justo las que sirven el HTML y el
# JavaScript, que es donde más falta hacen. El include se repite en cada
# location que toque `add_header`, y así todas las respuestas llevan todo.

# El navegador no adivina tipos de contenido: lo que no sea lo que dice ser,
# no se ejecuta.
add_header X-Content-Type-Options "nosniff" always;

# Nadie mete Norte en un iframe. En umbrelOS las apps se abren en su propia
# pestaña, así que esto no rompe nada y cierra el clickjacking.
add_header X-Frame-Options "SAMEORIGIN" always;

# Una app de finanzas no tiene por qué contarle a nadie desde qué pantalla
# vienes.
add_header Referrer-Policy "no-referrer" always;

# Norte no usa cámara, micrófono ni ubicación. Dicho explícitamente, ningún
# script que se colara podría pedirlos.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# La política de contenido. Todo es propio (`'self'`): la aplicación no carga
# nada de fuera A PROPÓSITO — ni fuentes, ni scripts, ni cotizaciones — y esta
# cabecera convierte esa decisión en una regla que el navegador hace cumplir.
# `style-src` lleva `'unsafe-inline'` porque React posiciona los gráficos con
# atributos `style`, que es inofensivo; los SCRIPTS inline sí quedan
# prohibidos, que es lo que corta un XSS que llegara a colarse.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
