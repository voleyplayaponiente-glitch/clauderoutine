# nginx de Norte dentro del Umbrel.
#
# Una sola puerta: este servidor sirve la aplicación en `/` y pasa `/api` al
# servidor Node. Que compartan dirección no es estética, es lo que quita de un
# plumazo el CORS, el contenido mixto (página https pidiendo a un http de casa)
# y la necesidad de un túnel para usar la app dentro de casa. En la app de
# empresa se aprendió por las malas, después de un rodeo entero con Tailscale.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Los documentos que se suben (nóminas, extractos) pueden ser gordos. El
  # servidor los limita por su cuenta; esto solo evita que nginx corte antes.
  client_max_body_size 32m;

  location /api/ {
    proxy_pass http://api:3012;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Sin esto, `trustProxy` del servidor vería a todo el mundo con la IP del
    # contenedor de nginx y el límite de intentos protegería a todos por igual,
    # que es como no proteger a nadie.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # El index y el service worker NUNCA se cachean: si se quedan pegados, un
  # despliegue nuevo no llega jamás al navegador y parece que no se arregló nada.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # El sello de versión de la interfaz. Si se cachea, la app nunca se entera de
  # que hay una versión nueva y el aviso no sirve para nada.
  location = /version.json {
    default_type application/json;
    add_header Cache-Control "no-store";
  }

  # **nginx no conoce estas dos extensiones**, y las dos duelen:
  #  · `.webmanifest` sin su tipo impide instalar la PWA.
  #  · `.mjs` servido como binario hace que el navegador se niegue a ejecutar el
  #    módulo. En la app de empresa esto dejó sin lectura de PDF a TODO el
  #    Umbrel —facturas, extractos y papeles de Hacienda— mientras en GitHub
  #    Pages funcionaba, porque allí sí se sirve como text/javascript.
  # Van como expresión regular a propósito: así ganan sobre `location /assets/`.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location ~ \.mjs$ {
    default_type text/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # El router va por hash, así que cualquier ruta desconocida es el index.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
