# Servidor de la app dentro del Umbrel.
#
# La clave está en `/api/`: el servicio de copias se sirve **por la misma
# dirección** que la aplicación. Eso quita de un plumazo los tres problemas que
# aparecen cuando la app vive en GitHub Pages y el servidor en casa:
#   · CORS (mismo origen, no hay petición cruzada),
#   · contenido mixto (la página ya no es HTTPS pidiendo a un HTTP),
#   · y la necesidad de Tailscale para usarla dentro de casa.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Las copias pueden ser grandes; el servicio las limita por su cuenta a 50 MB.
  client_max_body_size 64m;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }

  # El index y el service worker NO se cachean: si se quedan pegados, un
  # despliegue nuevo no llega nunca al navegador. El resto (js/css con hash en
  # el nombre) sí puede cachearse a lo bestia.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location = /manifest.webmanifest {
    # nginx tampoco conoce esta extensión; sin el tipo correcto, el navegador
    # no ofrece instalar la aplicación.
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # **nginx no sabe qué es un `.mjs`**: su tabla de tipos solo mapea `.js`, así
  # que servía el worker de pdf.js como binario y el navegador se negaba a
  # ejecutarlo («Failed to fetch dynamically imported module»). Resultado: no se
  # podía leer NINGÚN PDF —ni facturas, ni extractos, ni acuerdos de Hacienda—
  # servida la app desde el Umbrel, aunque en GitHub Pages funcionara.
  # Va como expresión regular a propósito: así gana sobre `/assets/`.
  location ~ \.mjs$ {
    default_type text/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # El router va por hash (#/), así que cualquier ruta desconocida es index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
