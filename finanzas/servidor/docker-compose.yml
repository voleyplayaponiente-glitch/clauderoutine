services:
  conectores-finanzas:
    build: .
    container_name: conectores-finanzas
    restart: unless-stopped
    ports:
      # El puerto del HOST es configurable desde .env (PUERTO_HOST). En un
      # servidor con otras aplicaciones ya montadas, el 3001 puede estar
      # cogido, y cambiarlo no debe obligar a editar este fichero.
      - "${PUERTO_HOST:-3001}:3001"
    env_file:
      - .env
    volumes:
      # Las copias viven FUERA del contenedor: si se recrea, no se pierden.
      - ./datos:/datos
